name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: ai-background-remover
        directory: out
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        branch: main
        
    - name: Upload deployment status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const { context } = require('@actions/github');
          const fs = require('fs');
          
          const status = context.payload.deployment?.state || 'unknown';
          const deploymentUrl = context.payload.deployment?.html_url || '';
          
          console.log(`Deployment status: ${status}`);
          console.log(`Deployment URL: ${deploymentUrl}`);
          
          // Add deployment status to PR comment
          if (context.payload.pull_request) {
            const issue_number = context.payload.pull_request.number;
            const comment = `🚀 Deployment status: ${status}\n📊 Deployment URL: ${deploymentUrl}`;
            
            github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }